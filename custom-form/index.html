<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <form class="form">
      <fieldset>
        <h3 class="header">Ваши личные данные</h3>
        <label class="label"> Ваше имя </label>
        <input class="input" name="first-name" placeholder="Имя" required />
        <label class="label"> Ваш возраст </label>
        <input
          class="input"
          type="number"
          name="age"
          placeholder="Возраст"
          required
        />
        <label class="label"> Ваш номер телефона </label>
        <input
          class="input"
          type="tel"
          name="tel-number"
          placeholder="Номер телефона"
          required
        />
        <label class="label"> Ваша почта </label>
        <input
          class="input"
          type="email"
          name="email"
          placeholder="Почта"
          required
        />
      </fieldset>
      <fieldset>
        <label class="label"> Сообщение </label>
        <textarea
          class="input-message"
          name="message"
          placeholder="Ваше сообщение"
        ></textarea>
        <label class="label checkbox-label">
          <input class="input-checkbox" type="checkbox" name="checkbox" />
          <span class="checkbox-text">Я принимаю правила</span>
        </label>
      </fieldset>
      <button class="button-submit" type="submit">Отправить</button>
    </form>
  </body>
</html>
